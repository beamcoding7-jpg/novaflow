<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NovaFlow — Intelligent Financial Operations & Global Treasury Platform</title>
  <meta name="description" content="Automate reconciliation, execute instant cross-border payouts, and monitor global liquidity in real-time. Built for high-growth enterprises.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <script>
    (function() {
      const saved = localStorage.getItem('novaflow-theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/modules/hero-dashboard.css">
  <link rel="stylesheet" href="css/modules/roi-calculator.css">
  <link rel="stylesheet" href="css/modules/pricing.css">
  <link rel="stylesheet" href="css/modules/accordion.css">
  <link rel="stylesheet" href="css/modules/modal-toast.css">
  <link rel="stylesheet" href="css/utilities.css">
</head>
<body>
  <!-- Header & Sticky Navigation Bar -->
  <header class="navbar">
    <div class="container navbar__inner">
      <a href="#" class="navbar__logo" aria-label="NovaFlow Home">
        <svg class="navbar__logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="32" height="32" rx="8" fill="currentColor" fill-opacity="0.12"/>
          <path d="M8 22L14 10L18 18L24 10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="24" cy="10" r="2.5" fill="currentColor"/>
        </svg>
        <span>NovaFlow</span>
      </a>

      <nav class="navbar__nav" aria-label="Main Navigation">
        <a href="#features" class="navbar__link">Products</a>
        <a href="#solutions" class="navbar__link">Solutions</a>
        <a href="#calculator" class="navbar__link">Calculator</a>
        <a href="#pricing" class="navbar__link">Pricing</a>
        <a href="#faq" class="navbar__link">FAQ</a>
      </nav>

      <div class="navbar__actions">
        <button class="theme-toggle" data-action="toggle-theme" aria-label="Switch to dark mode" type="button">
          <!-- Sun icon (visible in dark mode) -->
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <!-- Moon icon (visible in light mode) -->
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>

        <a href="#demo" class="btn btn-primary" data-action="open-demo">Book a Demo</a>

        <button class="mobile-menu-btn" data-action="toggle-mobile-menu" aria-label="Open mobile menu" aria-expanded="false" type="button">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile Navigation Drawer -->
  <div id="mobile-drawer" class="mobile-drawer" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Mobile Navigation">
    <div class="mobile-drawer__panel">
      <div class="mobile-drawer__header">
        <a href="#" class="navbar__logo" aria-label="NovaFlow Home">
          <svg class="navbar__logo-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="32" height="32" rx="8" fill="currentColor" fill-opacity="0.12"/>
            <path d="M8 22L14 10L18 18L24 10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="24" cy="10" r="2.5" fill="currentColor"/>
          </svg>
          <span>NovaFlow</span>
        </a>
        <button class="mobile-menu-btn" data-action="close-mobile-menu" aria-label="Close mobile menu" type="button">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <nav class="mobile-drawer__nav" aria-label="Mobile Navigation Links">
        <a href="#features" class="navbar__link">Products</a>
        <a href="#solutions" class="navbar__link">Solutions</a>
        <a href="#calculator" class="navbar__link">Calculator</a>
        <a href="#pricing" class="navbar__link">Pricing</a>
        <a href="#faq" class="navbar__link">FAQ</a>
      </nav>

      <div class="mobile-drawer__actions">
        <button class="btn btn-outline w-full" data-action="toggle-theme" type="button">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <span>Switch Theme</span>
        </button>
        <a href="#demo" class="btn btn-primary w-full" data-action="open-demo">Book a Demo</a>
      </div>
    </div>
  </div>

  <div id="app"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
